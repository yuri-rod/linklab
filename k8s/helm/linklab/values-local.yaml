api:
  image: "linklab-api"
  tag: "local"
  imagePullPolicy: IfNotPresent
  replicas: 1
  service:
    type: NodePort
    port: 80
    nodePort: 30080
  env:
    databaseURL: "postgres://linklab:linklab123@linklab-postgres:5432/linklab?sslmode=disable"
    redisURL: "redis://linklab-redis:6379"

worker:
  image: "linklab-worker"
  tag: "local"
  imagePullPolicy: IfNotPresent
  replicas: 1
  env:
    databaseURL: "postgres://linklab:CHANGEME_LOCAL_PASSWORD@linklab-postgres:5432/linklab?sslmode=disable"
    redisURL: "redis://linklab-redis:6379"

postgres:
  enabled: true
  image: postgres:16-alpine
  database: linklab
  username: linklab
  password: "CHANGEME_LOCAL_PASSWORD"

redis:
  enabled: true
  image: redis:7-alpine
