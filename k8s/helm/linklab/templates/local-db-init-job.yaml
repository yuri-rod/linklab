{{- if .Values.postgres.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "linklab.fullname" . }}-db-init
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: db-init
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          env:
            - name: PGPASSWORD
              value: {{ .Values.postgres.password | quote }}
          command:
            - /bin/sh
            - -c
          args:
            - |
              until pg_isready -h {{ include "linklab.fullname" . }}-postgres -U {{ .Values.postgres.username }}; do
                sleep 2
              done

              psql -h {{ include "linklab.fullname" . }}-postgres \
                -U {{ .Values.postgres.username }} \
                -d {{ .Values.postgres.database }} <<'SQL'
              CREATE TABLE IF NOT EXISTS links (
                code VARCHAR(10) PRIMARY KEY,
                url TEXT NOT NULL,
                created_at TIMESTAMP
              );

              CREATE TABLE IF NOT EXISTS clicks (
                id SERIAL PRIMARY KEY,
                code VARCHAR(10) REFERENCES links(code),
                clicked_at TIMESTAMP
              );
              SQL
{{- end }}
