apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "linklab.fullname" . }}-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: {{ include "linklab.fullname" . }}-api
  template:
    metadata:
      labels:
        app: {{ include "linklab.fullname" . }}-api
    spec:
      containers:
        - name: api
          image: "{{ .Values.api.image }}:{{ .Values.api.tag }}"
          imagePullPolicy: {{ .Values.api.imagePullPolicy }}
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              value: {{ .Values.api.env.databaseURL | quote }}
            - name: REDIS_URL
              value: {{ .Values.api.env.redisURL | quote }}
          resources:
            requests:
              cpu: {{ .Values.api.resources.requests.cpu }}
              memory: {{ .Values.api.resources.requests.memory }}
            limits:
              cpu: {{ .Values.api.resources.limits.cpu }}
              memory: {{ .Values.api.resources.limits.memory }}
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "linklab.fullname" . }}-api
spec:
  type: {{ .Values.api.service.type }}
  selector:
    app: {{ include "linklab.fullname" . }}-api
  ports:
    - port: {{ .Values.api.service.port }}
      targetPort: 8080
      {{- if and (eq .Values.api.service.type "NodePort") (.Values.api.service.nodePort) }}
      nodePort: {{ .Values.api.service.nodePort }}
      {{- end }}
