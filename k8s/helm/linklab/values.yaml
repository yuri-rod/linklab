api:
  image: "REPLACE_ECR/linklab-api"
  tag: "v1"
  imagePullPolicy: IfNotPresent
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi
  service:
    type: LoadBalancer
    port: 80
    nodePort: null
  env:
    databaseURL: "postgres://linklab:linklab123@postgres:5432/linklab?sslmode=disable"
    redisURL: "redis://redis:6379"

worker:
  image: "REPLACE_ECR/linklab-worker"
  tag: "v1"
  imagePullPolicy: IfNotPresent
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  env:
    databaseURL: "postgres://linklab:linklab123@postgres:5432/linklab?sslmode=disable"
    redisURL: "redis://redis:6379"

postgres:
  enabled: false
  image: postgres:16-alpine
  database: linklab
  username: linklab
  password: linklab123

redis:
  enabled: false
  image: redis:7-alpine
