apiVersion: apps/v1
kind: Deployment
metadata:
  name: linklab-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: linklab-api
  template:
    metadata:
      labels:
        app: linklab-api
    spec:
      containers:
        - name: api
          image: ${ECR_REGISTRY:-REPLACE_ECR}/linklab-api:v1
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: linklab-secrets
                  key: database-url
            - name: REDIS_URL
              valueFrom:
                secretKeyRef:
                  name: linklab-secrets
                  key: redis-url
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
---
apiVersion: v1
kind: Service
metadata:
  name: linklab-api
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 8080
  selector:
    app: linklab-api
