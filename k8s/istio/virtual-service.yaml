apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: linklab-api
spec:
  hosts:
    - linklab-api
  http:
    - route:
        - destination:
            host: linklab-api
            subset: v1
          weight: 90
        - destination:
            host: linklab-api
            subset: v2
          weight: 10
