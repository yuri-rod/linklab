apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linklab
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/REPLACE_USER/linklab.git
    targetRevision: main
    path: k8s/helm/linklab
    helm:
      valueFiles:
        - values-dev.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
