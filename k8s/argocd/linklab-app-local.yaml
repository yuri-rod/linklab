apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: linklab-local
  namespace: argocd
spec:
  project: default
  source:
    repoURL: REPLACE_REPO_URL
    targetRevision: REPLACE_REVISION
    path: k8s/helm/linklab
    helm:
      valueFiles:
        - values.yaml
        - values-local.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: linklab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
