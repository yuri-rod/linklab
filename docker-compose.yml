version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: linklab
      POSTGRES_USER: linklab
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Required environment variable POSTGRES_PASSWORD is not set. Copy .env.example to .env and configure.}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U linklab"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "127.0.0.1:6379:6379"

  localstack:
    image: localstack/localstack:3.8
    environment:
      - SERVICES=s3,lambda,iam,sts
      - AWS_DEFAULT_REGION=us-east-1
      - AWS_ACCESS_KEY_ID=test
      - AWS_SECRET_ACCESS_KEY=test
      - DEBUG=0
      - DOCKER_HOST=unix:///var/run/docker.sock
    ports:
      - "127.0.0.1:4566:4566"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./scripts/localstack/init-aws.sh:/etc/localstack/init/ready.d/init-aws.sh:ro
      - ./lambda:/workspace/lambda:ro
      - localstack-data:/var/lib/localstack
    healthcheck:
      test: ["CMD-SHELL", "awslocal s3 ls >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build: ./api
    environment:
      DATABASE_URL: ${DATABASE_URL:?Required environment variable DATABASE_URL is not set. Copy .env.example to .env and configure.}
      REDIS_URL: redis://redis:6379
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build: ./worker
    environment:
      DATABASE_URL: ${DATABASE_URL:?Required environment variable DATABASE_URL is not set. Copy .env.example to .env and configure.}
      REDIS_URL: redis://redis:6379
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8088:80"
    depends_on:
      api:
        condition: service_started

  prometheus:
    image: prom/prometheus:v2.54.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yaml:/etc/prometheus/alerts.yaml:ro
    depends_on:
      api:
        condition: service_started

  grafana:
    image: grafana/grafana:11.2.0
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?Required environment variable GRAFANA_ADMIN_PASSWORD is not set. Copy .env.example to .env and configure.}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      prometheus:
        condition: service_started

volumes:
  pgdata:
  grafana-data:
  localstack-data:
